<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Travels | Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <script src="../assets/js/theme.js"></script>
  </head>
  <body>
    <header class="site-header page-header">
      <nav class="navbar container">
        <a class="brand" href="homepage-5.html" aria-label="Quantum Travels home">
          <img class="brand-logo brand-logo--dark" src="../assets/images/quantum-logo-dark.png" alt="Quantum Travels" />
          <img class="brand-logo brand-logo--light" src="../assets/images/quantum-logo-light.png" alt="" aria-hidden="true" />
        </a>
        <div class="nav-links">
          <a href="homepage-5.html">Home</a>
          <a href="tour-grid-01.html">Tours</a>
          <a href="login.html">Admin Login</a>
          <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode" data-theme-toggle>
            <span class="theme-toggle-label theme-toggle-label--light">Light</span>
            <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
            <span class="theme-toggle-label theme-toggle-label--dark">Dark</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="container login-shell">
      <div class="login-card">
        <div class="login-header">
          <span class="eyebrow">Secure access</span>
          <h2>Admin Login</h2>
        </div>

        <form id="loginForm" class="admin-form login-form">
          <label>
            Email
            <input type="email" name="email" placeholder="admin@quantumtravels.com" required />
          </label>

          <label>
            Password
            <input type="password" name="password" placeholder="Enter password" required />
          </label>

          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>

        <div class="login-meta">
          <p>Default admin account:</p>
          <p><strong>Email:</strong> admin@quantumtravels.com</p>
          <p><strong>Password:</strong> Quantum@123</p>
        </div>
      </div>
    </main>

    <script src="../assets/js/auth.js"></script>
  </body>
</html>
